services:
  - type: web
    plan: free
    runtime: image
    name: n8n-service
    image:
      url: docker.io/n8nio/n8n:latest
    envVars:
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        value: 123456
      - key: WEBHOOK_URL
        value: https://n8n-service.onrender.com/
      - key: N8N_DEFAULT_TEMP_DIR
        value: /tmp
      - key: TZ
        value: Asia/Ho_Chi_Minh

databases:
  - name: n8n-db
    plan: free
